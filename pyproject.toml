[project]
name = "freshstack-mcp"
version = "0.1.0"
description = "Evidence-backed technology intelligence layer for AI coding agents to prevent outdated or version-incompatible code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FreshStack Team" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "packaging>=23.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
freshstack = "freshstack.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freshstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
